<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GupShup - Anonymous Radar</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,sans-serif;
    background:#080d18;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:480px;
    height:100vh;
    overflow:hidden;
    position:relative;
    background:#080d18;
}

/* HEADER */
.header{
    height:72px;
    padding:13px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(10,16,30,.96);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:27px;
    font-weight:800;
}

.logo span{
    color:#42e8a4;
}

.subtitle{
    color:#94a3b8;
    font-size:11px;
    margin-top:3px;
}

.online{
    font-size:11px;
    color:#42e8a4;
}

/* STATUS */
.status{
    position:absolute;
    z-index:20;
    top:82px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(15,23,42,.9);
    border:1px solid rgba(255,255,255,.1);
    padding:7px 13px;
    border-radius:20px;
    font-size:11px;
    white-space:nowrap;
}

/* RADAR */
.radar-area{
    height:calc(100vh - 72px);
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at center,
      rgba(20,184,166,.07),
      transparent 42%);
}

.radar{
    position:absolute;
    width:370px;
    height:370px;
    left:50%;
    top:48%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1px solid rgba(66,232,164,.25);
    box-shadow:
      0 0 40px rgba(66,232,164,.04),
      inset 0 0 50px rgba(66,232,164,.03);
}

.ring{
    position:absolute;
    border:1px solid rgba(66,232,164,.18);
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.r1{width:280px;height:280px}
.r2{width:190px;height:190px}
.r3{width:100px;height:100px}

.cross-v,
.cross-h{
    position:absolute;
    background:rgba(66,232,164,.13);
}

.cross-v{
    width:1px;
    height:100%;
    left:50%;
    top:0;
}

.cross-h{
    height:1px;
    width:100%;
    top:50%;
    left:0;
}

/* SWEEP */
.sweep{
    position:absolute;
    width:50%;
    height:2px;
    left:50%;
    top:50%;
    transform-origin:left center;
    background:linear-gradient(
        90deg,
        rgba(66,232,164,.8),
        transparent
    );
    animation:scan 4s linear infinite;
}

@keyframes scan{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

/* YOU */
.you{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:66px;
    height:66px;
    border-radius:50%;
    background:#102c29;
    border:2px solid #42e8a4;
    box-shadow:0 0 0 8px rgba(66,232,164,.06),
               0 0 30px rgba(66,232,164,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:8;
}

.you-icon{
    font-size:27px;
}

.you-label{
    position:absolute;
    top:calc(50% + 38px);
    left:50%;
    transform:translateX(-50%);
    color:#42e8a4;
    font-size:10px;
    font-weight:bold;
}

/* RADAR PROFILE */
.radar-profile{
    position:absolute;
    width:54px;
    height:54px;
    border-radius:50%;
    background:#182235;
    border:2px solid #7dd3fc;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    cursor:pointer;
    z-index:10;
    box-shadow:0 5px 18px rgba(0,0,0,.4);
    transition:.2s;
}

.radar-profile:hover{
    transform:scale(1.12);
    border-color:#42e8a4;
}

.radar-profile .dot{
    position:absolute;
    width:9px;
    height:9px;
    right:1px;
    bottom:1px;
    border-radius:50%;
    background:#42e8a4;
    border:2px solid #182235;
}

.distance{
    position:absolute;
    top:55px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(15,23,42,.92);
    color:#cbd5e1;
    border-radius:10px;
    padding:3px 6px;
    font-size:8px;
    white-space:nowrap;
}

/* BOTTOM INFO */
.bottom-info{
    position:absolute;
    bottom:18px;
    left:15px;
    right:15px;
    text-align:center;
    z-index:12;
}

.radar-help{
    color:#94a3b8;
    font-size:11px;
}

/* PROFILE MODAL */
.modal{
    position:absolute;
    inset:0;
    z-index:50;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(8px);
    display:none;
    align-items:flex-end;
}

.card{
    width:100%;
    background:#111827;
    border-radius:24px 24px 0 0;
    padding:25px 20px 28px;
    text-align:center;
    border-top:1px solid rgba(255,255,255,.1);
}

.big-avatar{
    width:100px;
    height:100px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(145deg,#26354f,#101827);
    border:3px solid #42e8a4;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    box-shadow:0 10px 35px rgba(0,0,0,.35);
}

.profile-name{
    font-size:20px;
    font-weight:bold;
    margin-top:12px;
}

.profile-distance{
    color:#94a3b8;
    font-size:12px;
    margin:5px 0 18px;
}

.btn{
    width:100%;
    border:0;
    padding:13px;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.connect{
    background:#42e8a4;
    color:#06120e;
}

.cancel{
    background:#263244;
    color:white;
}

/* REQUEST POPUP */
.request-overlay{
    position:absolute;
    inset:0;
    z-index:90;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(7px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:22px;
}

.request-card{
    width:100%;
    background:#111827;
    border-radius:22px;
    padding:25px 20px;
    text-align:center;
    border:1px solid rgba(255,255,255,.1);
}

.request-avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:52px;
    background:#1e293b;
    border:3px solid #7dd3fc;
}

.request-title{
    font-size:19px;
    font-weight:bold;
    margin-top:13px;
}

.request-text{
    color:#94a3b8;
    font-size:12px;
    margin:7px 0 15px;
}

.accept{
    background:#42e8a4;
    color:#06120e;
}

.reject{
    background:#263244;
    color:white;
}

/* CHAT */
.chat-screen{
    position:absolute;
    inset:0;
    z-index:80;
    display:none;
    flex-direction:column;
    overflow:hidden;
    background:#f1f5f9;
    color:#111827;
}

.chat-head{
    width:100%;
    flex-shrink:0;
    min-height:68px;
    background:#111827;
    color:white;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 15px;
}

.chat-avatar{
    width:45px;
    height:45px;
    flex:0 0 45px;
    border-radius:50%;
    background:#1e293b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.chat-user{
    font-weight:bold;
}

.chat-status{
    color:#42e8a4;
    font-size:10px;
    margin-top:2px;
}

.chat-user-info{
    flex:1;
    min-width:0;
}

.chat-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:7px;
}

.pending-btn,
.disconnect-btn{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    font-size:16px;
}

.pending-btn{
    background:#263244;
    color:white;
}

.pending-btn:hover{
    background:#334155;
}

.disconnect-btn{
    background:#ef4444;
    color:white;
}

.disconnect-btn:hover{
    background:#dc2626;
}

.pending-btn span{
    position:absolute;
    top:-4px;
    right:-4px;
    min-width:17px;
    height:17px;
    padding:0 4px;
    border-radius:20px;
    background:#f59e0b;
    color:#111827;
    font-size:9px;
    font-weight:bold;
    display:none;
    align-items:center;
    justify-content:center;
}

.messages{
    flex:1;
    min-height:0;
    width:100%;
    min-width:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:15px 15px 90px;
}

.msg{
    max-width:78%;
    padding:10px 13px;
    margin-bottom:9px;
    border-radius:16px;
    font-size:14px;
    word-break:break-word;
}

.msg.me{
    margin-left:auto;
    background:#2563eb;
    color:white;
    border-bottom-right-radius:4px;
}

.msg.other{
    background:white;
    border-bottom-left-radius:4px;
}

.typing-indicator{
    position:absolute;
    left:15px;
    bottom:76px;
    display:none;
    align-items:center;
    gap:4px;
    padding:6px 10px;
    border-radius:14px;
    background:#e5e7eb;
    color:#6b7280;
    font-size:12px;
    z-index:90;
}

.typing-indicator span:not(.typing-text){
    width:5px;
    height:5px;
    border-radius:50%;
    background:#6b7280;
    animation:typingDot 1.2s infinite ease-in-out;
}

.typing-indicator span:nth-child(2){
    animation-delay:.15s;
}

.typing-indicator span:nth-child(3){
    animation-delay:.3s;
}

.typing-text{
    margin-left:3px;
}

@keyframes typingDot{
    0%,60%,100%{
        opacity:.35;
        transform:translateY(0);
    }
    30%{
        opacity:1;
        transform:translateY(-2px);
    }
}

.chat-input{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:100;
    display:flex;
    gap:7px;
    width:100%;
    padding:10px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    background:white;
    border-top:1px solid #ddd;
    transition:bottom .15s ease;
}

.chat-input input{
    flex:1;
    min-width:0;
    border:1px solid #d1d5db;
    border-radius:10px;
    padding:11px;
    outline:none;
    font-size:16px;
}

.chat-input button{
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    padding:0 16px;
    font-weight:bold;
}

.toast{
    position:absolute;
    top:115px;
    left:50%;
    transform:translateX(-50%);
    background:#111827;
    color:white;
    padding:9px 14px;
    border-radius:20px;
    font-size:11px;
    z-index:100;
    display:none;
}

</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div>
            <div class="logo">Gup<span>Shup</span></div>
            <div class="subtitle">Anonymous Radar</div>
        </div>

        <div class="online">
            ● RADAR ON
        </div>
    </header>

    <div id="status" class="status">
        📍 Getting location...
    </div>

    <div id="toast" class="toast"></div>

    <!-- RADAR -->

    <main id="radarScreen" class="radar-area">

        <div class="radar">

            <div class="ring r1"></div>
            <div class="ring r2"></div>
            <div class="ring r3"></div>

            <div class="cross-v"></div>
            <div class="cross-h"></div>

            <div class="sweep"></div>

        </div>

        <div class="you">
            <div class="you-icon">◎</div>
        </div>

        <div class="you-label">
            YOU
        </div>

        <div id="radarUsers"></div>

        <div class="bottom-info">
            <div class="radar-help">
                👆 Tap any profile on the radar to view
            </div>
        </div>

    </main>


    <!-- PROFILE MODAL -->

    <div id="profileModal" class="modal">

        <div class="card">

            <div id="bigAvatar" class="big-avatar">
                🙂
            </div>

            <div id="profileName" class="profile-name">
                Stranger
            </div>

            <div id="profileDistance" class="profile-distance">
                Nearby
            </div>

            <button id="connectBtn"
                    class="btn connect">
                📨 Request to GupShup
            </button>

            <button id="cancelBtn"
                    class="btn cancel">
                Cancel
            </button>

        </div>

    </div>


    <!-- INCOMING REQUEST -->

    <div id="requestOverlay"
         class="request-overlay">

        <div class="request-card">

            <div id="requestAvatar"
                 class="request-avatar">
                🙂
            </div>

            <div class="request-title">
                Someone wants to GupShup
            </div>

            <div id="requestText"
                 class="request-text">
                A stranger wants to start a conversation.
            </div>

            <button id="acceptBtn"
                    class="btn accept">
                ✓ Accept
            </button>

            <button id="rejectBtn"
                    class="btn reject">
                ✕ Reject
            </button>

        </div>

    </div>


    <!-- CHAT -->

    <div id="chatScreen"
         class="chat-screen">

        <div class="chat-head">

            <div id="chatAvatar"
                 class="chat-avatar">
                🙂
            </div>

            <div class="chat-user-info">

                <div id="chatUser"
                     class="chat-user">
                    Stranger
                </div>

                <div class="chat-status">
                    ● Anonymous connection
                </div>

            </div>

            <div class="chat-actions">

                <button id="pendingBtn"
                        class="pending-btn"
                        title="Pending requests">
                    🔔
                    <span id="pendingCount">0</span>
                </button>

                <button id="disconnectBtn"
                        class="disconnect-btn"
                        title="Disconnect chat">
                    ✕
                </button>

            </div>

        </div>

        <div id="typingIndicator"
             class="typing-indicator">
            <span></span><span></span><span></span>
            <span class="typing-text">typing...</span>
        </div>

        <div id="messages"
             class="messages">
        </div>

        <div class="chat-input">

            <input id="messageInput"
                   type="text"
                   placeholder="Type your message..."
                   autocomplete="off">

            <button id="sendBtn">
                Send
            </button>

        </div>

    </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io({
    reconnection:true,
    reconnectionAttempts:Infinity,
    reconnectionDelay:1000,
    reconnectionDelayMax:5000,
    timeout:20000
});

const status =
    document.getElementById("status");

const radarUsers =
    document.getElementById("radarUsers");

const profileModal =
    document.getElementById("profileModal");

const bigAvatar =
    document.getElementById("bigAvatar");

const profileName =
    document.getElementById("profileName");

const profileDistance =
    document.getElementById("profileDistance");

const connectBtn =
    document.getElementById("connectBtn");

const cancelBtn =
    document.getElementById("cancelBtn");

const requestOverlay =
    document.getElementById("requestOverlay");

const requestAvatar =
    document.getElementById("requestAvatar");

const requestText =
    document.getElementById("requestText");

const acceptBtn =
    document.getElementById("acceptBtn");

const rejectBtn =
    document.getElementById("rejectBtn");

const chatScreen =
    document.getElementById("chatScreen");

const chatAvatar =
    document.getElementById("chatAvatar");

const chatUser =
    document.getElementById("chatUser");

const messages =
    document.getElementById("messages");

const typingIndicator =
    document.getElementById("typingIndicator");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const toast =
    document.getElementById("toast");

const chatInput =
    document.querySelector(".chat-input");

const pendingBtn =
    document.getElementById("pendingBtn");

const pendingCount =
    document.getElementById("pendingCount");


let deviceId =
    localStorage.getItem(
        "gupshupDeviceId"
    );

if(!deviceId){

    deviceId =
        "GS-" +
        Math.random()
        .toString(36)
        .substring(2,10)
        .toUpperCase();

    localStorage.setItem(
        "gupshupDeviceId",
        deviceId
    );

}


let selectedUser = null;
let incomingRequest = null;
let pendingRequests = [];



/* MOBILE KEYBOARD
   Only the input bar moves above the keyboard.
   The chat screen itself does not resize or zoom.
*/

function updateKeyboardPosition(){

    if(!chatInput)
        return;

    if(
        chatScreen.style.display !== "flex" ||
        !window.visualViewport
    ){

        chatInput.style.bottom = "0px";
        return;

    }

    const viewport =
        window.visualViewport;

    const layoutHeight =
        document.documentElement.clientHeight;

    const keyboardHeight =
        Math.max(
            0,
            layoutHeight -
            viewport.height -
            viewport.offsetTop
        );

    const isKeyboardOpen =
        keyboardHeight > 80;

    chatInput.style.bottom =
        isKeyboardOpen
            ? keyboardHeight + "px"
            : "0px";

    if(isKeyboardOpen){

        requestAnimationFrame(() => {

            messages.scrollTop =
                messages.scrollHeight;

        });

    }

}

if(window.visualViewport){

    window.visualViewport.addEventListener(
        "resize",
        updateKeyboardPosition
    );

    window.visualViewport.addEventListener(
        "scroll",
        updateKeyboardPosition
    );

}

messageInput.addEventListener(
    "focus",
    () => {

        setTimeout(
            updateKeyboardPosition,
            100
        );

        setTimeout(
            updateKeyboardPosition,
            350
        );

    }
);

messageInput.addEventListener(
    "blur",
    () => {

        setTimeout(
            updateKeyboardPosition,
            100
        );

    }
);

/* CONNECTION */

socket.on("connect", () => {

    status.textContent =
        "🟢 Radar connected";

    socket.emit("register", {
        deviceId:deviceId
    });

    requestLocation();

});


/* LOCATION */

function requestLocation(){

    if(!navigator.geolocation){

        status.textContent =
            "Location not supported";

        return;

    }

    navigator.geolocation.getCurrentPosition(

        position => {

            socket.emit("location", {

                lat:
                    position.coords.latitude,

                lng:
                    position.coords.longitude

            });

            status.textContent =
                "🟢 Radar active";

            loadRadar();

        },

        () => {

            status.textContent =
                "📍 Allow location for Radar";

        },

        {
            enableHighAccuracy:true,
            maximumAge:10000,
            timeout:10000
        }

    );

}


/* RADAR REFRESH */

function loadRadar(){

    socket.emit(
        "get-radar-users"
    );

}


setInterval(
    loadRadar,
    5000
);


/* RADAR USERS */

socket.on(
    "radar-users",
    users => {

        radarUsers.innerHTML = "";

        users.forEach(
            (user,index) => {

                createRadarProfile(
                    user,
                    index,
                    users.length
                );

            }
        );

        status.textContent =
            `🟢 Radar active • ${users.length} nearby`;

    }
);


/* CREATE RADAR PROFILE */

function createRadarProfile(
    user,
    index,
    total
){

    const profile =
        document.createElement("div");

    profile.className =
        "radar-profile";


    /*
     * Radar positions.
     * Profiles are distributed around
     * the rings.
     */

    const angle =
        (index / Math.max(total,1))
        * Math.PI * 2;

    const ring =
        index % 3;

    const radius =
        ring === 0 ? 70 :
        ring === 1 ? 135 :
        190;


    const x =
        Math.cos(angle) * radius;

    const y =
        Math.sin(angle) * radius;


    profile.style.left =
        `calc(50% + ${x}px)`;

    profile.style.top =
        `calc(48% + ${y}px)`;


    profile.style.transform =
        "translate(-50%,-50%)";


    profile.textContent =
        user.avatar;


    const onlineDot =
        document.createElement("div");

    onlineDot.className =
        "dot";


    const distance =
        document.createElement("div");

    distance.className =
        "distance";

    distance.textContent =
        formatDistance(
            user.distance
        );


    profile.appendChild(
        onlineDot
    );

    profile.appendChild(
        distance
    );


    profile.onclick = () => {

        selectProfile(user);

    };


    radarUsers.appendChild(
        profile
    );

}


/* SELECT */

function selectProfile(user){

    selectedUser =
        user;

    bigAvatar.textContent =
        user.avatar;

    profileName.textContent =
        user.name;

    profileDistance.textContent =
        "📍 " +
        formatDistance(
            user.distance
        );

    profileModal.style.display =
        "flex";

}


/* CANCEL */

cancelBtn.onclick = () => {

    selectedUser = null;

    profileModal.style.display =
        "none";

};


/* SEND REQUEST */

connectBtn.onclick = () => {

    if(!selectedUser)
        return;

    socket.emit(
        "send-request",
        selectedUser.id
    );

    profileModal.style.display =
        "none";

    showToast(
        "📨 Request sent. Waiting for acceptance..."
    );

};


/* REQUEST SENT */

socket.on(
    "request-sent",
    () => {

        showToast(
            "⏳ Waiting for stranger to accept..."
        );

    }
);


/* INCOMING REQUEST */

socket.on(
    "connection-request",
    data => {

        if (
            !pendingRequests.some(
                request =>
                    request.requestId === data.requestId
            )
        ) {
            pendingRequests.push(data);
        }

        updatePendingButton();

        /*
         * अगर अभी chat में नहीं हैं,
         * तो request तुरंत दिखाई जाएगी.
         */

        if (
            chatScreen.style.display !== "flex"
        ) {

            showNextPendingRequest();

        }

    }
);

/* PENDING REQUESTS */

function updatePendingButton(){

    if(pendingRequests.length > 0){

        pendingCount.textContent =
            pendingRequests.length;

        pendingCount.style.display =
            "flex";

        pendingBtn.style.display =
            "flex";

    }else{

        pendingCount.textContent =
            "0";

        pendingCount.style.display =
            "none";

    }

}


function showNextPendingRequest(){

    if(pendingRequests.length === 0){

        requestOverlay.style.display =
            "none";

        incomingRequest = null;

        return;

    }

    const data =
        pendingRequests[0];

    incomingRequest =
        data.requestId;

    requestAvatar.textContent =
        data.avatar;

    requestText.textContent =
        `${data.name} wants to GupShup with you.`;

    requestOverlay.style.display =
        "flex";

}


/* OPEN PENDING REQUEST */

pendingBtn.onclick = () => {

    showNextPendingRequest();

};
/* ACCEPT */

acceptBtn.onclick = () => {

    if(!incomingRequest)
        return;

    socket.emit(
        "accept-request",
        incomingRequest
    );

};

/* REJECT */

rejectBtn.onclick = () => {

    if(!incomingRequest)
        return;

    socket.emit(
        "reject-request",
        incomingRequest
    );

    requestOverlay.style.display =
        "none";

    incomingRequest = null;

    pendingRequests.shift();

    updatePendingButton();

    showToast(
        "Request rejected"
    );

};


/* ACCEPTED */

socket.on(
    "request-accepted",
    user => {

        requestOverlay.style.display =
            "none";

        incomingRequest = null;

        pendingRequests.shift();

        updatePendingButton();

        openChat(user);

    }
);


/* REJECTED */

socket.on(
    "request-rejected",
    () => {

        showToast(
            "❌ Stranger rejected the request"
        );

    }
);


/* CHAT */

function openChat(user){

    document.getElementById(
        "radarScreen"
    ).style.display =
        "none";

    chatScreen.style.display =
        "flex";

    chatAvatar.textContent =
        user.avatar;

    chatUser.textContent =
        user.name;

    messages.innerHTML = `
        <div style="
            text-align:center;
            color:#64748b;
            font-size:11px;
            margin-bottom:15px;
        ">
            🔐 Both users accepted the connection.
            <br>
            You can now GupShup anonymously.
        </div>
    `;

    messageInput.focus();

    setTimeout(
        updateKeyboardPosition,
        100
    );

    setTimeout(
        updateKeyboardPosition,
        350
    );

}


let typingTimer = null;
let isTyping = false;

function setTypingState(state){

    if(state === isTyping)
        return;

    isTyping = state;

    socket.emit(
        "typing",
        state
    );
}

messageInput.addEventListener(
    "input",
    () => {

        if(messageInput.value.trim()){

            setTypingState(true);

            clearTimeout(typingTimer);

            typingTimer = setTimeout(
                () => {
                    setTypingState(false);
                },
                900
            );

        }else{

            clearTimeout(typingTimer);
            setTypingState(false);

        }

    }
);

/* SEND MESSAGE */

sendBtn.onclick =
    sendMessage;


messageInput.addEventListener(
    "keydown",
    e => {

        if(e.key === "Enter"){

            e.preventDefault();

            sendMessage();

        }

    }
);


function sendMessage(){

    const text =
        messageInput.value.trim();

    if(!text)
        return;

    addMessage(
        text,
        "me"
    );

    clearTimeout(typingTimer);
    setTypingState(false);

    socket.emit(
        "message",
        text
    );

    messageInput.value = "";

}


socket.on(
    "message",
    data => {

        if(typingIndicator){
            typingIndicator.style.display = "none";
        }

        addMessage(
            data.text,
            "other"
        );

    }
);


socket.on(
    "typing",
    state => {

        if(!typingIndicator)
            return;

        typingIndicator.style.display =
            state ? "flex" : "none";

        messages.scrollTop =
            messages.scrollHeight;

    }
);


function addMessage(
    text,
    type
){

    const div =
        document.createElement("div");

    div.className =
        "msg " + type;

    div.textContent =
        text;

    messages.appendChild(
        div
    );

    messages.scrollTop =
        messages.scrollHeight;

}


/* NEXT */

/* DISCONNECT CHAT */

const disconnectBtn =
    document.getElementById("disconnectBtn");

disconnectBtn.onclick = () => {

    clearTimeout(typingTimer);
    setTypingState(false);

    if(typingIndicator){
        typingIndicator.style.display = "none";
    }

    socket.emit(
        "next-stranger"
    );

    chatScreen.style.display =
        "none";

    chatInput.style.bottom =
        "0px";

    document.getElementById(
        "radarScreen"
    ).style.display =
        "block";

    messages.innerHTML = "";

    selectedUser = null;

    loadRadar();

    showToast(
        "👋 Chat disconnected"
    );

};


/* STRANGER LEFT */

socket.on(
    "stranger-left",
    () => {

        clearTimeout(typingTimer);
        isTyping = false;

        if(typingIndicator){
            typingIndicator.style.display = "none";
        }

        chatScreen.style.display =
            "none";

        document.getElementById(
            "radarScreen"
        ).style.display =
            "block";

        showToast(
            "👋 Stranger left the chat"
        );

        loadRadar();

    }
);


/* ERROR */

socket.on(
    "request-error",
    message => {

        showToast(
            "⚠️ " + message
        );

    }
);


/* TOAST */

function showToast(text){

    toast.textContent =
        text;

    toast.style.display =
        "block";

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {

                toast.style.display =
                    "none";

            },
            3500
        );

}


/* DISTANCE */

function formatDistance(km){

    if(km < 1){

        return Math.round(
            km * 1000
        ) + " m";

    }

    return km.toFixed(1) +
        " km";

}

</script>
